<!doctype html>
<html><head><meta charset="utf-8"><title>Map preview</title>
<style>body{background:#222;margin:0}canvas{image-rendering:pixelated;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/core.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/art_kid.js"></script>
<script src="../js/art_world.js"></script>
<script>
// Renders a test map so tiles and props can be checked in every theme.
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'meadow';
const S = +(q.get('s') || 3);
const map = [
  '##########################',
  '#......,,.....###........#',
  '#..T....d.....###...r....#',
  '#.......d....,....vvv....#',
  '#..,....ddddd.....vvv..T.#',
  '#.....#.....d.....v.v....#',
  '#.....#..n..d..c.........#',
  '#..####..S..d..x..11.....#',
  '#...........d.....11..~~~#',
  '#..,,...B...d.........~~.#',
  '#...........d..LL........#',
  '#....l......d..LL...g..P.#',
  '#...i.......d...C..U..Q..#',
  '##########################',
];
const L = G.parseLevel({ id: 'test', theme, map, spikes: { 1: { period: 2, up: 1 } } });
G.KID.build();
const m = G.renderMap(L);
const cv = document.getElementById('c');
cv.width = G.LW * S; cv.height = G.LH * S;
const off = document.createElement('canvas'); off.width = G.LW; off.height = G.LH;
const x = off.getContext('2d');
x.drawImage(m.bg, 0, 0);
for (let r = 0; r < G.ROWS; r++) for (let c = 0; c < G.COLS; c++) {
  const ch = L.at(c, r);
  if (ch === '~') x.drawImage(G.liquidTile('water', theme, 0), c * 16, r * 16);
  if (ch === 'L') x.drawImage(G.liquidTile('lava', theme, 0), c * 16, r * 16);
  if (ch === '1') x.drawImage(G.spikeTile(theme, (c + r) % 3), c * 16, r * 16);
  if (ch === 'c') x.drawImage(G.crackOverlay(1), c * 16, r * 16);
}
const items = m.props.map(p => ({ y: p.y, draw: () => G.drawFrame(x, p.f, p.x, p.y) }));
const dirs = ['down', 'up', 'left'];
for (let i = 0; i < 3; i++) for (let f = 0; f < 3; f++) {
  const px = 9 * 16 + 8 + f * 18 + i * 60, py = 9 * 16 + 14;
  items.push({ y: py, draw: () => { x.fillStyle = 'rgba(10,6,18,0.35)'; x.beginPath(); x.ellipse(px, py - 1, 5, 2, 0, 0, 7); x.fill(); G.drawFrame(x, G.KID[dirs[i]][f], px, py); } });
}
items.sort((a, b) => a.y - b.y).forEach(it => it.draw());
const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
ctx.drawImage(off, 0, 0, cv.width, cv.height);
document.title = 'ready';
</script>
</body></html>
