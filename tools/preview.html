<!doctype html>
<html><head><meta charset="utf-8"><title>Sprite preview</title>
<style>body{background:#2a2630;margin:0;color:#fff;font:12px monospace}canvas{image-rendering:pixelated;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/core.js"></script>
<script src="../js/art/lib.js"></script>
<script src="../js/art/tiles.js"></script>
<script src="../js/art/furniture.js"></script>
<script src="../js/art_kid.js"></script>
<script src="../js/art/chars_main.js"></script>
<script src="../js/art/caretaker.js"></script>
<script src="../js/engine/world.js"></script>
<script src="../js/engine/events.js"></script>
<script>
// Loads the same content scripts as index.html (art definitions live there too).
document.write([...(window.PREVIEW_EXTRA || [])].map((s) => '<script src="' + s + '"><\/script>').join(''));
</script>
<script>
// Pull the content script list from index.html at runtime is not possible from file://,
// so content files are listed in tools/preview_files.js (kept in sync by tools/build.js).
</script>
<script src="preview_files.js"></script>
<script>
document.write((window.CONTENT_FILES || []).map((s) => '<script src="../' + s + '"><\/script>').join(''));
</script>
<script>
// Shows every sprite and character whose name starts with ?only= (comma separated), at scale ?s=
window.addEventListener('load', () => {
  const q = new URLSearchParams(location.search);
  const S = +(q.get('s') || 4);
  const only = (q.get('only') || '').split(',').filter(Boolean);
  const match = (n) => !only.length || only.some((o) => n.startsWith(o));
  if (G.KID && G.KID.build) G.KID.build();
  if (G.GAME && G.GAME.boot) try { G.GAME.boot(); } catch (e) {}
  const groups = [];
  for (const n of G.spriteNames()) if (match(n)) groups.push({ name: n, frames: G.getSprite(n).frames });
  for (const n of G.charNames()) if (match('char:' + n) || match(n)) { const c = G.getChar(n); groups.push({ name: 'char:' + n, frames: [].concat(c.down, c.up, c.left, c.right || []) }); }
  const cols = +(q.get('cols') || 4);
  const PAD = 6;
  // pack rows of up to `cols` groups
  const rows = [];
  for (let i = 0; i < groups.length; i += cols) rows.push(groups.slice(i, i + cols));
  const cell = (g) => g.frames.reduce((s, f) => s + f.w + 2, 0);
  let W = 0, H = 0;
  const rh = rows.map((r) => { W = Math.max(W, r.reduce((s, g) => s + Math.max(cell(g), 60) + PAD * 2, 0)); return r.reduce((m, g) => Math.max(m, ...g.frames.map((f) => f.h)), 0); });
  H = rh.reduce((s, h) => s + h * S + 16, 0);
  const cv = document.getElementById('c');
  cv.width = Math.max(200, W * S); cv.height = Math.max(50, H);
  const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = q.get('bg') || '#4a4652'; x.fillRect(0, 0, cv.width, cv.height);
  let y = 0;
  rows.forEach((r, ri) => {
    let cx = 0;
    for (const g of r) {
      x.fillStyle = '#fff'; x.font = '11px monospace'; x.fillText(g.name, cx * S + 2, y + 11);
      let fx = cx;
      for (const f of g.frames) { x.fillStyle = 'rgba(0,0,0,0.15)'; x.fillRect(fx * S, y + 14, f.w * S, f.h * S); x.drawImage(f.c, fx * S, y + 14, f.w * S, f.h * S); fx += f.w + 2; }
      cx += Math.max(cell(g), 60) + PAD * 2;
    }
    y += rh[ri] * S + 16;
  });
  document.title = 'ready';
});
</script></body></html>
