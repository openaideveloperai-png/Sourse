<!doctype html>
<html><head><meta charset="utf-8"><title>Sprite preview</title>
<style>body{background:#2a2630;margin:0;color:#fff;font:12px monospace}canvas{image-rendering:pixelated;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/core.js"></script>
<script src="../js/art/lib.js"></script>
<script src="../js/art/tiles.js"></script>
<script src="../js/art/furniture.js"></script>
<script src="../js/art_kid.js"></script>
<script src="../js/art/chars_main.js"></script>
<script src="../js/art/caretaker.js"></script>
<script src="../js/art/cast.js"></script>
<script src="../js/art/danchi.js"></script>
<script src="../js/art/props.js"></script>
<script src="../js/art/extra.js"></script>
<script src="../js/art/pics.js"></script>
<script src="../js/art/props2.js"></script>
<script src="../js/art/outdoor.js"></script>
<script src="../js/art/icons.js"></script>
<script src="../js/engine/world.js"></script>
<script src="../js/engine/events.js"></script>
<script>
// Loads the same content scripts as index.html (art definitions live there too).
document.write([...(window.PREVIEW_EXTRA || [])].map((s) => '<script src="' + s + '"><\/script>').join(''));
</script>
<script>
// Pull the content script list from index.html at runtime is not possible from file://,
// so content files are listed in tools/preview_files.js (kept in sync by tools/build.js).
</script>
<script src="preview_files.js"></script>
<script>
document.write((window.CONTENT_FILES || []).map((s) => '<script src="../' + s + '"><\/script>').join(''));
</script>
<script>
// Shows every sprite and character whose name starts with ?only= (comma separated), at scale ?s=
window.addEventListener('load', () => {
  const q = new URLSearchParams(location.search);
  const S = +(q.get('s') || 4);
  const only = (q.get('only') || '').split(',').filter(Boolean);
  const match = (n) => !only.length || only.some((o) => n.startsWith(o));
  if (G.KID && G.KID.build) G.KID.build();
  if (G.GAME && G.GAME.boot) try { G.GAME.boot(); } catch (e) {}
  // ?walk=1: walk-cycle filmstrips (sequence 0,1,0,2,0,1,0,2) for every character in all four
  // directions, on a ground line with a grid, to check that steps alternate smoothly
  if (q.get('walk')) {
    const names = G.charNames().filter((n) => match('char:' + n) || match(n));
    const seq = [0, 1, 0, 2, 0, 1, 0, 2];
    const dirs = ['down', 'left', 'right', 'up'];
    const cw = 30, ch = 52;
    const cv = document.getElementById('c');
    const sc = S;
    cv.width = 90 + seq.length * cw * sc; cv.height = names.length * (dirs.length * ch * sc + 16) + 20;
    const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
    x.fillStyle = q.get('bg') || '#4a4652'; x.fillRect(0, 0, cv.width, cv.height);
    let y = 0;
    for (const n of names) {
      x.fillStyle = '#fff'; x.font = '12px monospace'; x.fillText('char:' + n, 4, y + 12); y += 16;
      const c = G.getChar(n);
      for (const d of dirs) {
        x.fillStyle = '#ccc'; x.fillText(d, 4, y + ch * sc / 2);
        let arr = c[d], flip = false;
        if (!arr && d === 'right') { arr = c.left; flip = true; }
        const n = arr.length - 1;
        const sq = arr.length >= 5 ? Array.from({ length: 8 }, (_, k) => 1 + (k % n)) : seq;
        sq.forEach((fi, k) => {
          const f = arr[fi] || arr[0];
          const ox = 90 + k * cw * sc, base = y + (ch - 6) * sc;
          x.fillStyle = 'rgba(0,0,0,0.18)'; x.fillRect(ox, y, cw * sc - 2, ch * sc - 2);
          x.fillStyle = 'rgba(255,255,255,0.25)'; x.fillRect(ox, base, cw * sc - 2, 1);
          for (let gy = base - 8 * sc; gy > y; gy -= 8 * sc) { x.fillStyle = 'rgba(255,255,255,0.07)'; x.fillRect(ox, gy, cw * sc - 2, 1); }
          x.save();
          const px = ox + (cw * sc) / 2;
          if (flip) { x.translate(px, 0); x.scale(-1, 1); x.translate(-px, 0); }
          x.drawImage(f.c, Math.round(px - f.ax * sc), Math.round(base - f.ay * sc), f.w * sc, f.h * sc);
          x.restore();
          x.fillStyle = '#aaa'; x.font = '10px monospace'; x.fillText(String(fi), ox + 2, y + 10);
        });
        y += ch * sc;
      }
    }
    document.title = 'ready';
    return;
  }
  const groups = [];
  // ?portraits=1 shows every portrait in G.PORTRAITS with all its expressions
  if (q.get('portraits')) {
    for (const n of Object.keys(G.PORTRAITS)) if (match(n)) {
      const fn = G.PORTRAITS[n];
      const ex = fn.exprs || ['neutral'];
      groups.push({ name: n + ' (' + ex.join(' ') + ')', frames: ex.map((e) => { const c = fn(e); return { c: c, w: c.width, h: c.height }; }) });
    }
  } else
  for (const n of G.spriteNames()) if (match(n)) groups.push({ name: n, frames: G.getSprite(n).frames });
  if (!q.get('portraits')) for (const n of G.charNames()) if (match('char:' + n) || match(n)) { const c = G.getChar(n); groups.push({ name: 'char:' + n, frames: [].concat(c.down, c.up, c.left, c.right || []) }); }
  const cols = +(q.get('cols') || 4);
  const PAD = 6;
  // pack rows of up to `cols` groups
  const rows = [];
  for (let i = 0; i < groups.length; i += cols) rows.push(groups.slice(i, i + cols));
  const cell = (g) => g.frames.reduce((s, f) => s + f.w + 2, 0);
  let W = 0, H = 0;
  const rh = rows.map((r) => { W = Math.max(W, r.reduce((s, g) => s + Math.max(cell(g), 60) + PAD * 2, 0)); return r.reduce((m, g) => Math.max(m, ...g.frames.map((f) => f.h)), 0); });
  H = rh.reduce((s, h) => s + h * S + 16, 0);
  const cv = document.getElementById('c');
  cv.width = Math.max(200, W * S); cv.height = Math.max(50, H);
  const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = q.get('bg') || '#4a4652'; x.fillRect(0, 0, cv.width, cv.height);
  let y = 0;
  rows.forEach((r, ri) => {
    let cx = 0;
    for (const g of r) {
      x.fillStyle = '#fff'; x.font = '11px monospace'; x.fillText(g.name, cx * S + 2, y + 11);
      let fx = cx;
      for (const f of g.frames) { x.fillStyle = 'rgba(0,0,0,0.15)'; x.fillRect(fx * S, y + 14, f.w * S, f.h * S); x.drawImage(f.c, fx * S, y + 14, f.w * S, f.h * S); fx += f.w + 2; }
      cx += Math.max(cell(g), 60) + PAD * 2;
    }
    y += rh[ri] * S + 16;
  });
  document.title = 'ready';
});
</script></body></html>
