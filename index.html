<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wrong Way Home</title>
<meta name="description" content="A brutally hard pixel-art game. Hit by a truck, sent to another world, and everything there wants you dead.">
<link rel="stylesheet" href="css/style.css">
</head>

  <canvas id="game" width="416" height="240" aria-label="Wrong Way Home game screen"></canvas>

<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine/world.js"></script>
<script src="js/engine/events.js"></script>
<script src="js/engine/chase.js"></script>
<script src="js/engine/explore.js"></script>
